project_name = "clip-daemon"
project_root = "."
source_roots = ["src"]
fingerprint_inputs = ["test_support", "packaging", "scripts", "flake.nix", "justfile"]
output_dir = "target/analysis"

[rust]
helper_manifest = "../rust-quality-lens/rust_helpers/Cargo.toml"
identity_resolution = "auto"
rust_analyzer = "rust-analyzer"
identity_timeout_seconds = 60
identity_offline = true

[verification]
workspace = true
all_targets = true
all_features = true
locked = true
audit = true
unused_dependencies = true
unused_dependency_backend = "cargo-machete"
flaky_test_runs = 3
