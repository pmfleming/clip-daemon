[package]
name = "clip-turso-contract"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clip-turso-contract"
path = "../../examples/turso_contract.rs"

[dependencies]
anyhow = "1"
futures-lite = "2.6"
turso = { version = "=0.8.3", default-features = false, features = ["fts"] }
