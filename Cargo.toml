[package]
name = "clip-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Clipboard policy and clip-api daemon for Shelllist"
repository = "https://github.com/pmfleming/clip-daemon"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clipboard-history-client-sdk = { version = "=0.16.2", features = ["watcher-utils"] }
# Use the reviewed core API directly. Cargo.lock also keeps the SDK's broad
# internal `version = "0"` range on 0.16.2; core 0.17 is incompatible.
clipboard-history-core = "=0.16.2"
hex = "0.4"
hmac = "0.12"
shelllist-search = { path = "vendor/shelllist-search" }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
rustix = { version = "1", features = ["fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-daemon-core = { path = "../daemon-framework/crates/shelllist-daemon-core" }
shelllist-daemon-tokio = { path = "../daemon-framework/crates/shelllist-daemon-tokio" }
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", features = ["tokio"] }
wl-clipboard-rs = "=0.9.3"

[features]
benchmarks = []

[dev-dependencies]
allocation-counter = "0.8.1"
tempfile = "3"
