[package]
name = "clip-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Clipboard policy and clip-api daemon for Shelllist"
repository = "https://github.com/pmfleming/clip-daemon"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
futures-lite = "2.6"
turso = { version = "=0.8.3", default-features = false, features = ["fts"] }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
rustix = { version = "1", features = ["fs", "net", "event", "pipe", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-daemon-core = { path = "../daemon-framework/crates/shelllist-daemon-core" }
shelllist-daemon-tokio = { path = "../daemon-framework/crates/shelllist-daemon-tokio" }
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5.18", features = ["tokio"] }
wl-clipboard-rs = "=0.9.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
benchmarks = []
native-quickshell-socket = []

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
tempfile = "3"

[patch.crates-io]
# Turso's current Tantivy range still selects vulnerable zstd 0.13.
# This upstream snapshot updates compression and drops an unused dev dependency.
tantivy-sstable = { path = "vendor/tantivy-sstable" }
